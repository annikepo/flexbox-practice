<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox Practice</title>
  <link rel="stylesheet" href="styles/style.css">
</head>

<body>

  <main class="page">

    <section class="squares">
      <div class="squares__row squares__row--top">
        <div class="square-group square-group--three">
          <div class="square"></div>
          <div class="square"></div>
          <div class="square"></div>
        </div>

        <div class="square-group square-group--three">
          <div class="square"></div>
          <div class="square"></div>
          <div class="square"></div>
        </div>
      </div>

      <div class="squares__row squares__row--middle">
        <div class="square-group square-group--three">
          <div class="square"></div>
          <div class="square"></div>
          <div class="square"></div>
        </div>

        <div class="square-group square-group--three">
          <div class="square"></div>
          <div class="square"></div>
          <div class="square"></div>
        </div>
      </div>

      <div class="squares__row squares__row--bottom">
        <div class="square-group square-group--three">
          <div class="square square--text">Some text</div>
          <div class="square square--text">Some text</div>
          <div class="square square--text">Some text</div>
        </div>

        <div class="square-group square-group--three">
          <div class="square"></div>
          <div class="square square--wide"></div>
          <div class="square"></div>
        </div>
      </div>
    </section>

    <section class="circles">
      <div class="circle-panel circle-panel--dark">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
      </div>

      <div class="circle-panel circle-panel--red">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
      </div>

      <div class="circle-panel circle-panel--dark">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
      </div>

      <div class="circle-panel circle-panel--red">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
      </div>

      <div class="circle-panel circle-panel--dark">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
      </div>
    </section>

  </main>

</body>
</html>
