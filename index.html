<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox Practice</title>

  <link rel="stylesheet" href="styles/normalize.css">
  <link rel="stylesheet" href="styles/style.css">
</head>

<body>

  <main class="page">

    <section class="squares">
      <h1 class="section-title">Squares</h1>

      <div class="square-group square-group--top-left">
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
      </div>

      <div class="square-group square-group--top-right">
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
      </div>

      <div class="square-group square-group--middle-left">
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
      </div>

      <div class="square-group square-group--middle-right">
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
      </div>

      <div class="square-group square-group--bottom-left">
        <div class="square square--text">
          <p class="square__text">Some text</p>
        </div>

        <div class="square square--text">
          <p class="square__text">Some text</p>
        </div>

        <div class="square square--text">
          <p class="square__text">Some text</p>
        </div>
      </div>

      <div class="square-group square-group--bottom-right">
        <div class="square"></div>
        <div class="square square--wide"></div>
        <div class="square"></div>
      </div>
    </section>

    <section class="circles">
      <h2 class="section-title">Circles</h2>

      <div class="circle-panel circle-panel--top-left">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
      </div>

      <div class="circle-panel circle-panel--top-middle">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
      </div>

      <div class="circle-panel circle-panel--top-right">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
      </div>

      <div class="circle-panel circle-panel--bottom-left">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
      </div>

      <div class="circle-panel circle-panel--bottom-middle">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
      </div>
    </section>

  </main>

</body>
</html>
